name: Build and test

on:
  push:
    branches: [main, feature/automatic-vip-earnings]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Run Worker smoke tests
        run: node --test worker/index.test.js